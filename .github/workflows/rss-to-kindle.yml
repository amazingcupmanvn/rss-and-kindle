name: RSS to Kindle

on:
  schedule:
    # GitHub cron is always in UTC. Format: minute hour day month weekday.
    # "0 21 * * *" = every day at 21:00 UTC. Change the hour to suit you.
    - cron: "0 21 * * *"
  workflow_dispatch: # adds a "Run workflow" button for manual test runs

permissions:
  contents: write # needed to commit seen.json back to the repo

concurrency:
  group: rss-to-kindle
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build digest and email it to Kindle
        run: python rss2kindle.py
        env:
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }} # optional; leave unset for Gmail

      - name: Save list of sent articles
        run: |
          if [[ -n "$(git status --porcelain seen.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "Update seen articles"
            git push
          fi
